name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.9"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/gen_screens_doc.py --check
      - run: uv run python scripts/gen_permissions_doc.py --check

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      CI: "true"
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      KX_TEST_DATABASE_URL: postgresql+psycopg://kx_app:ci-app@localhost:5432/kxerp_test
      KX_TEST_MIGRATOR_DATABASE_URL: postgresql+psycopg://kx_migrator:ci-migrator@localhost:5432/kxerp_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.9"
      - run: uv sync --frozen
      - name: Create database roles and the test database (same scripts as docker-compose)
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -v app_password=ci-app -v migrator_password=ci-migrator -f docker/postgres/roles.sql
          psql -v ON_ERROR_STOP=1 -d postgres -v dbname=kxerp_test -f docker/postgres/database.sql
      - run: uv run pytest
