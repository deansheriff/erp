<!DOCTYPE html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;padding:24px;background:#F6F6FA;font-family:Inter,Segoe UI,Arial,sans-serif;color:#16162A;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border:1px solid #E4E4EE;border-radius:16px;">
      <tr><td style="padding:28px 32px 8px;font-size:18px;font-weight:700;">
        <span style="display:inline-block;width:12px;height:12px;border-radius:4px;background:#5A4BDB;margin-right:8px;"></span>Kxmeleon
        <div style="font-size:13px;font-weight:400;color:#626280;margin-top:4px;">{{ organisation }}</div>
      </td></tr>
      <tr><td style="padding:16px 32px 32px;font-size:15px;line-height:24px;">
        {% block body %}{% endblock %}
      </td></tr>
    </table>
    <p style="font-size:12px;color:#626280;margin-top:16px;">You received this because someone used your address on {{ organisation }}'s Kxmeleon system.</p>
  </td></tr></table>
</body>
</html>
