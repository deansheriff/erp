<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#F6F6FA;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "danger-bg": "#FFE4E6", "surface-dim": "#d9dade", "ink-3": "#626280", "surface-container": "#ededf1", "on-tertiary-container": "#ffd7c1", "primary": "#412ec2", "surface-container-high": "#e8e8ec", "on-tertiary-fixed": "#321300", "iris-tint": "#EEECFD", "on-background": "#1a1c1f", "outline-variant": "#c8c4d7", "tertiary-fixed-dim": "#ffb68b", "on-secondary-fixed-variant": "#3b4d00", "on-surface": "#1a1c1f", "success-text": "#0F6B3E", "on-secondary-container": "#536b00", "on-tertiary-fixed-variant": "#743400", "error": "#ba1a1a", "destructive": "#C42836", "on-error-container": "#93000a", "error-container": "#ffdad6", "secondary-container": "#c4ef49", "secondary-fixed-dim": "#acd530", "success-bg": "#DDF7E8", "surface-container-highest": "#e2e2e6", "on-iris": "#FFFFFF", "on-secondary-fixed": "#161f00", "surface-sunken": "#EFEFF6", "primary-fixed-dim": "#c5c0ff", "on-primary-container": "#e0dbff", "danger-text": "#B4232F", "tertiary-container": "#9f4a00", "on-tertiary": "#ffffff", "lime-ink": "#4D7A0A", "secondary": "#4f6600", "tertiary": "#7a3700", "on-primary-fixed-variant": "#3d28be", "on-primary": "#ffffff", "ink-2": "#4B4B66", "warning-bg": "#FFF1D6", "lime": "#C5F04A", "surface-variant": "#e2e2e6", "inverse-surface": "#2e3034", "surface-tint": "#5646d7", "info-bg": "#DFEBFF", "inverse-primary": "#c5c0ff", "outline": "#787586", "on-seco   </head><body class="bg-canvas font-body text-body text-ink flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(22,22,42,0.04)] pt-safe"><div class="h-14 px-space-sm flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-lg text-ink-2 hover:text-ink transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-h2 text-h2 text-ink">Request Leave</h1></div><div class="flex items-center gap-space-xs"><button aria-label="Form info" class="w-11 h-11 flex items-center justify-center rounded-lg text-ink-3 hover:text-ink transition-colors"><span class="material-symbols-outlined text-[20px]">help_outline</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-safe bg-canvas"><div class="flex flex-col w-full pb-28">
<!-- Header Context Notice -->
<div class="px-space-md pt-space-md pb-space-sm">
<div class="flex items-center gap-space-xs text-ink-2 font-body-sm text-body-sm">
<span class="material-symbols-outlined text-[18px] text-iris">verified_user</span>
<span>Your manager <strong class="font-label text-ink">Tunde Bakare</strong> approves</span>
</div>
</div>
<form class="flex flex-col gap-space-md px-space-md" id="leave-form" onsubmit="event.preventDefault();">
<!-- Type of Leave Fieldset -->
<fieldset class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<legend class="font-label text-label text-ink">Type of leave</legend>
<span class="font-overline text-overline uppercase tracking-wider text-ink-3">Allowance 2026</span>
</div>
<div class="bg-surface rounded-xl shadow-sm overflow-hidden flex flex-col">
<!-- Annual Leave (Selected) -->
<label class="leave-option relative flex items-center justify-between min-h-[48px] px-space-md py- space-sm cursor-pointer transition-colors bg-iris-tint" data-balance="2" data-type="annual">
<div class="flex items-center gap-space-md">
<input checked="" class="sr-only peer" name="leave_type" type="radio" value="annual"/>
<div class="w-5 h-5 rounded-full bg-surface flex items-center justify-center transition-all peer-checked:bg-iris">
<div class="w-2 h-2 rounded-full bg-on-iris"></div>
</div>
<span class="font-label text-label text-ink">Annual</span>
</div>
<span class="font-h3 text-h3 text-iris">2 left</span>
</label>
<!-- Sick Leave -->
<label class="leave-option relative flex items-center justify-between min-h-[48px] px-space-md py-space-sm cursor-pointer transition-colors bg-surface hover:bg-surface-container-low" data-balance="8" data-type="sick">
<div class="flex items-center gap-space-md">
<input class="sr-only peer" name="leave_type" type="radio" value="sick"/>
<div class="w-5 h-5 rounded-full bg-surface-container flex items-center justify-center transition-all peer-checked:bg-iris">
<div class="w-2 h-2 rounded-full bg-on-iris opacity-0 peer-checked:opacity-100"></div>
</div>
<span class="font-body text-body text-ink">Sick</span>
</div>
<span class="font-body-sm text-body-sm text-ink-2">8 left</span>
</label>
<!-- Maternity Leave -->
<label class="leave-option relative flex items-center justify-between min-h-[48px] px-space-md py-space-sm cursor-pointer transition-colors bg-surface hover:bg-surface-container-low" data-balance="84" data-type="maternity">
<div class="flex items-center gap-space-md">
<input class="sr-only peer" name="leave_type" type="radio" value="maternity"/>
<div class="w-5 h-5 rounded-full bg-surface-container flex items-center justify-center transition-all peer-checked:bg-iris">
<div class="w-2 h-2 rounded-full bg-on-iris opacity-0 peer-checked:opacity-100"></div>
</div>
<span class="font-body text-body text-ink">Maternity</span>
</div>
<span class="font-body-sm text-body-sm text-ink-2">84 left</span>
</label>
<!-- Paternity Leave -->
<label class="leave-option relative flex items-center justify-between min-h-[48px] px-space-md py-space-sm cursor-pointer transition-colors bg-surface hover:bg-surface-container-low" data-balance="0" data-type="paternity">
<div class="flex items-center gap-space-md">
<input class="sr-only peer" name="leave_type" type="radio" value="paternity"/>
<div class="w-5 h-5 rounded-full bg-surface-container flex items-center justify-center transition-all peer-checked:bg-iris">
<div class="w-2 h-2 rounded-full bg-on-iris opacity-0 peer-checked:opacity-100"></div>
</div>
<span class="font-body text-body text-ink">Paternity</span>
</div>
<span class="font-body-sm text-body-sm text-ink-3">0 left</span>
</label>
<!-- Compassionate Leave -->
<label class="leave-option relative flex items-center justify-between min-h-[48px] px-space-md py-space-sm cursor-pointer transition-colors bg-surface hover:bg-surface-container-low" data-balance="0" data-type="compassionate">
<div class="flex items-center gap-space-md">
<input class="sr-only peer" name="leave_type" type="radio" value="compassionate"/>
<div class="w-5 h-5 rounded-full bg-surface-container flex items-center justify-center transition-all peer-checked:bg-iris">
<div class="w-2 h-2 rounded-full bg-on-iris opacity-0 peer-checked:opacity-100"></div>
</div>
<span class="font-body text-body text-ink">Compassionate</span>
</div>
<span class="font-body-sm text-body-sm text-ink-3">0 left</span>
</label>
<!-- Study Leave -->
<label class="leave-option relative flex items-center justify-between min-h-[48px] px-space-md py-space-sm cursor-pointer transition-colors bg-surface hover:bg-surface-container-low" data-balance="0" data-type="study">
<div class="flex items-center gap-space-md">
<input class="sr-only peer" name="leave_type" type="radio" value="study"/>
<div class="w-5 h-5 rounded-full bg-surface-container flex items-center justify-center transition-all peer-checked:bg-iris">
<div class="w-2 h-2 rounded-full bg-on-iris opacity-0 peer-checked:opacity-100"></div>
</div>
<span class="font-body text-body text-ink">Study</span>
</div>
<span class="font-body-sm text-body-sm text-ink-3">0 left</span>
</label>
<!-- Unpaid Leave -->
<label class="leave-option relative flex items-center justify-between min-h-[48px] px-space-md py-space-sm cursor-pointer transition-colors bg-surface hover:bg-surface-container-low" data-balance="999" data-type="unpaid">
<div class="flex items-center gap-space-md">
<input class="sr-only peer" name="leave_type" type="radio" value="unpaid"/>
<div class="w-5 h-5 rounded-full bg-surface-container flex items-center justify-center transition-all peer-checked:bg-iris">
<div class="w-2 h-2 rounded-full bg-on-iris opacity-0 peer-checked:opacity-100"></div>
</div>
<span class="font-body text-body text-ink">Unpaid</span>
</div>
<span class="font-body-sm text-body-sm text-ink-2">No limit</span>
</label>
</div>
</fieldset>
<!-- Date Selection Section -->
<div class="flex flex-col gap-space-md">
<!-- First Day -->
<div class="bg-surface rounded-xl p-space-md shadow-sm flex flex-col gap-space-sm">
<label class="font-label text-label text-ink flex items-center justify-between" for="first-day-input">
<span>First day <span class="text-destructive">*</span></span>
<span class="font-overline text-overline text-ink-3 uppercase">Start</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-11 px-space-md pr-11 bg-surface-sunken rounded-lg font-body text-body text-ink focus:outline-none focus:bg-surface-container-low transition-colors" id="first-day-input" placeholder="DD/MM/YYYY" type="text" value="24/12/2026"/>
<button aria-label="Select start date" class="absolute right-0 w-11 h-11 flex items-center justify-center text-iris hover:text-iris-hover transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">calendar_month</span>
</button>
</div>
<label class="flex items-center gap-space-sm min-h-[44px] cursor-pointer pt-1 select-none">
<input class="w-5 h-5 rounded accent-iris bg-surface-sunken cursor-pointer" id="half-day-start" type="checkbox"/>
<span class="font-body-sm text-body-sm text-ink-2">Start in the afternoon (half day)</span>
</label>
</div>
<!-- Last Day -->
<div class="bg-surface rounded-xl p-space-md shadow-sm flex flex-col gap-space-sm">
<div class="flex items-baseline justify-between">
<label class="font-label text-label text-ink" for="last-day-input">Last day</label>
<span class="font-body-sm text-body-sm text-ink-3">Single day if blank</span>
</div>
<div class="relative flex items-center">
<input class="w-full h-11 px-space-md pr-11 bg-surface-sunken rounded-lg font-body text-body text-ink focus:outline-none focus:bg-surface-container-low transition-colors" id="last-day-input" placeholder="DD/MM/YYYY" type="text" value="28/12/2026"/>
<button aria-label="Select end date" class="absolute right-0 w-11 h-11 flex items-center justify-center text-iris hover:text-iris-hover transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">calendar_month</span>
</button>
</div>
<label class="flex items-center gap-space-sm min-h-[44px] cursor-pointer pt-1 select-none">
<input checked="" class="w-5 h-5 rounded accent-iris bg-surface-sunken cursor-pointer" id="half-day-end" type="checkbox"/>
<span class="font-body-sm text-body-sm text-ink">Finish at midday (half day)</span>
</label>
</div>
</div>
<!-- Soft Iris Summary Card -->
<div class="bg-iris-tint rounded-xl p-space-md flex flex-col gap-space-sm shadow-sm relative overflow-hidden">
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="font-overline text-overline text-ink-2 uppercase tracking-wide">Calculated duration</span>
<span class="font-stat text-stat text-primary leading-tight">1.5 days</span>
</div>
<div class="bg-surface/80 backdrop-blur-md rounded-full px-space-sm py-1 flex items-center gap-1 shadow-sm">
<span class="material-symbols-outlined text-[16px] text-success-text">account_balance_wallet</span>
<span class="font-label text-label text-success-text">0.5 left after</span>
</div>
</div>
<!-- Public Holiday / Policy Notice -->
<div class="bg-surface/70 rounded-lg p-space-sm flex items-start gap-space-xs mt-1">
<span class="material-symbols-outlined text-[18px] text-warning-text shrink-0 mt-0.5">event_busy</span>
<div class="flex flex-col">
<span class="font-label text-label text-ink">Skips Christmas Day (25 Dec 2026)</span>
<span class="font-body-sm text-body-sm text-ink-3">Statutory Nigerian public holiday automatically deducted.</span>
</div>
</div>
</div>
<!-- Reason Field -->
<div class="bg-surface rounded-xl p-space-md shadow-sm flex flex-col gap-space-xs">
<label class="font-label text-label text-ink flex items-center justify-between" for="leave-reason">
<span>Reason (optional)</span>
<span class="font-body-sm text-body-sm text-ink-3" id="char-count">0/150</span>
</label>
<textarea class="w-full p-space-sm bg-surface-sunken rounded-lg font-body text-body text-ink focus:outline-none focus:bg-surface-container-low transition-colors resize-none" id="leave-reason" maxlength="150" placeholder="e.g. End of year family holiday and travel to Ibadan..." rows="3"></textarea>
</div>
</form>
<!-- Sticky Bottom Action Bar -->
<aside class="fixed bottom-0 left-0 right-0 z-40 bg-surface/90 backdrop-blur-xl shadow-[0_-4px_16px_rgba(22,22,42,0.06)] pb-safe">
<div class="px-space-md py-space-sm flex items-center gap-space-sm">
<button class="flex-1 h-11 px-space-md rounded-lg bg-surface-container hover:bg-surface-container-high text-ink font-label text-label transition-colors flex items-center justify-center gap-1" id="check-days-btn" type="button">
<span class="material-symbols-outlined text-[18px]">calculate</span>
<span>Check days</span>
</button>
<button class="flex-1 h-11 px-space-md rounded-lg bg-primary hover:bg-iris-hover text-on-primary font-label text-label transition-transform active:scale-[0.98] shadow-md flex items-center justify-center gap-space-xs" id="submit-request-btn" type="button">
<span>Send request</span>
<span class="material-symbols-outlined text-[18px]">send</span>
</button>
</div>
</aside>
</div>
<script>
  (() => {
    // Leave Type Radio Behavior & Highlighting
    const leaveRows = document.querySelectorAll('.leave-option');
    leaveRows.forEach(row => {
      row.addEventListener('click', () => {
        leaveRows.forEach(r => {
          r.classList.remove('bg-iris-tint');
          r.classList.add('bg-surface');
          const radioIcon = r.querySelector('.w-5');
          const innerDot = r.querySelector('.w-2');
          const rightText = r.querySelector('span:last-child');
          
          if (radioIcon) radioIcon.classList.replace('bg-iris', 'bg-surface-container');
          if (innerDot) innerDot.classList.add('opacity-0');
          if (rightText && !r.dataset.balance.startsWith('0')) {
            rightText.classList.remove('text-iris', 'font-h3');
            rightText.classList.add('text-ink-2', 'font-body-sm');
          }
        });

        row.classList.remove('bg-surface');
        row.classList.add('bg-iris-tint');
        const activeRadio = row.querySelector('.w-5');
        const activeDot = row.querySelector('.w-2');
        const activeRightText = row.querySelector('span:last-child');
        const radioInput = row.querySelector('input[type="radio"]');

        if (radioInput) radioInput.checked = true;
        if (activeRadio) {
          activeRadio.classList.remove('bg-surface-container');
          activeRadio.classList.add('bg-iris');
        }
        if (activeDot) activeDot.classList.remove('opacity-0');
        if (activeRightText) {
          activeRightText.classList.add('text-iris', 'font-h3');
          activeRightText.classList.remove('text-ink-2', 'text-ink-3');
        }
      });
    });

    // Reason Character Counter Micro-interaction
    const textarea = document.getElementById('leave-reason');
    const charCount = document.getElementById('char-count');
    if (textarea && charCount) {
      textarea.addEventListener('input', (e) => {
        const len = e.target.value.length;
        charCount.textContent = `${len}/150`;
        if (len >= 140) {
          charCount.classList.add('text-warning-text');
        } else {
          charCount.classList.remove('text-warning-text');
        }
      });
    }

    // Submit animation feedback
    const submitBtn = document.getElementById('submit-request-btn');
    if (submitBtn) {
      submitBtn.addEventListener('click', () => {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>
          <span>Sending...</span>
        `;
        setTimeout(() => {
          submitBtn.innerHTML = `
            <span class="material-symbols-outlined text-[18px]">check_circle</span>
            <span>Requested!</span>
          `;
          submitBtn.classList.replace('bg-primary', 'bg-success-text');
        }, 800);
      });
    }
  })();
</script></main></body></html>
