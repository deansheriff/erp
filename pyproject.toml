[project]
name = "kxmeleon-erp"
version = "0.1.0"
description = "Kxmeleon ERP: HR, payroll, finance and operations for Nigerian businesses."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "boto3>=1.44.6",
    "celery[redis]>=5.4",
    "cryptography>=43",
    "defusedxml>=0.7.1",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "filetype>=1.2.0",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyotp>=2.9",
    "python-multipart>=0.0.17",
    "pyyaml>=6.0",
    "qrcode>=8.0",
    "redis>=5.2",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
kx = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "migrations", "scripts"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RET", "PTH", "TID", "ASYNC",
  "BLE", "DTZ", "T20", "RUF", "PL",
]
ignore = [
  "PLR0913",  # many-argument service functions are explicit, not a smell here
  "PLR2004",  # magic numbers in tests and HTTP status codes
  "N818",     # domain errors read as nouns: NotFound, PermissionDenied, Conflict
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S311", "PLC0415", "PLR0912", "PLR0917"]
"migrations/**" = ["E501"]
"scripts/**" = ["T201"]
"app/cli.py" = ["T201", "PLC0415"]  # commands import what they need lazily
# Field names such as "password_confirm" are not hard-coded secrets.
"app/identity/*.py" = ["S105"]
# FastAPI form handlers take one parameter per form field.
"app/**/routes_*.py" = ["PLR0917"]
# The one module allowed to use the S3 client (ADR 0016).
"app/files/storage.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.orm.Query".msg = "Use select() with Session.execute/scalars; session.query() is banned."
"boto3".msg = "Only app/files may talk to object storage."
"botocore".msg = "Only app/files may talk to object storage."

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "qrcode.*", "filetype.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests", "app"]
addopts = "-ra --strict-markers"
markers = [
  "db: needs a real PostgreSQL 16 database (KX_TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core, audit and modules never import the web layer"
# A module's routes_api.py / routes_web.py will need an ignore entry here when it lands.
type = "forbidden"
source_modules = ["app.core", "app.audit", "app.authz", "app.modules", "app.identity", "app.mail", "app.org", "app.files"]
forbidden_modules = ["fastapi", "starlette", "app.web"]
ignore_imports = [
  "app.identity.routes_web -> fastapi",
  "app.identity.routes_web -> app.web.*",
  "app.identity.routes_api -> fastapi",
  "app.identity.routes_api -> app.web.access",
  "app.authz.routes_web -> fastapi",
  "app.authz.routes_web -> app.web.*",
  "app.audit.routes_web -> fastapi",
  "app.audit.routes_web -> app.web.*",
  "app.org.routes_web -> fastapi",
  "app.org.routes_web -> app.web.*",
  "app.modules.hr.routes_web -> fastapi",
  "app.modules.hr.routes_web -> app.web.*",
  "app.modules.hr.routes_people -> fastapi",
  "app.modules.hr.routes_people -> app.web.*",
  "app.modules.hr.routes_self -> fastapi",
  "app.modules.hr.routes_self -> app.web.*",
  "app.modules.hr.routes_process -> fastapi",
  "app.modules.hr.routes_process -> app.web.*",
  "app.files.routes_web -> fastapi",
  "app.files.routes_web -> app.web.*",
  "app.files.web -> fastapi",
]

[[tool.importlinter.contracts]]
name = "Core packages never import business modules"
# Business modules build on the core, never the reverse. app/wiring.py, app/main.py and
# app/worker.py are the composition roots that connect them.
type = "forbidden"
source_modules = ["app.core", "app.audit", "app.authz", "app.identity", "app.mail", "app.org", "app.files", "app.web"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "Only app.files talks to object storage"
type = "forbidden"
source_modules = ["app.core", "app.audit", "app.web", "app.modules", "app.authz", "app.identity", "app.mail", "app.org"]
forbidden_modules = ["boto3", "botocore"]
# Others may call app.files, which uses the S3 client; they may not import it themselves.
allow_indirect_imports = true

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.6",
    "httpx>=0.28",
    "import-linter>=2.1",
    "moto[s3]>=5.2.5",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20261113",
]
